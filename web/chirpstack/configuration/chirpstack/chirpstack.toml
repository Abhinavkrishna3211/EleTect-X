# Logging.
[logging]

  # Log level.
  #
  # Options are: trace, debug, info, warn error.
  level="info"


# PostgreSQL configuration.
[postgresql]

  # PostgreSQL DSN.
  #
  # Format example: postgres://<USERNAME>:<PASSWORD>@<HOSTNAME>/<DATABASE>?sslmode=<SSLMODE>.
  #
  # SSL mode options:
  #  * disable - Do not use TLS
  #  * prefer - Attempt to connect with TLS but allow sessions without
  #  * require - Require the use of TLS
  # Password from POSTGRES_PASSWORD in .env, same variable the postgres
  # container is created with, passed in by docker-compose.yml.
  dsn="postgres://chirpstack:$POSTGRESQL_PASSWORD@$POSTGRESQL_HOST/chirpstack?sslmode=disable"

  # Max open connections.
  #
  # This sets the max. number of open connections that are allowed in the
  # PostgreSQL connection pool.
  max_open_connections=10

  # Min idle connections.
  #
  # This sets the min. number of idle connections in the PostgreSQL connection
  # pool (0 = equal to max_open_connections).
  min_idle_connections=0


# Redis configuration.
[redis]

  # Server address or addresses.
  #
  # Set multiple addresses when connecting to a cluster.
  servers=[
    "redis://$REDIS_HOST/",
  ]

  # TLS enabled.
  tls_enabled=false

  # Redis Cluster.
  #
  # Set this to true when the provided URLs are pointing to a Redis Cluster
  # instance.
  cluster=false


# Network related configuration.
[network]

  # Network identifier (NetID, 3 bytes) encoded as HEX (e.g. 010203).
  net_id="000000"

  # Enabled regions.
  #
  # Multiple regions can be enabled simultaneously. Each region must match
  # the 'name' parameter of the region configuration in '[[regions]]'.
  # Trimmed to the one region this deployment uses. Only regions listed here
  # are loaded, and each needs its matching region_<name>.toml in this
  # directory - adding a region means both, plus CHIRPSTACK_REGION in .env,
  # which drives the gateway-bridge topic templates in docker-compose.yml.
  # The region files for every other band are in the upstream project; see
  # README.md.
  enabled_regions=[
    "in865",
  ]


# API interface configuration.
[api]

  # interface:port to bind the API interface to.
  bind="0.0.0.0:8080"

  # Secret.
  #
  # This secret is used for generating login and API tokens, make sure this
  # is never exposed. Changing this secret will invalidate all login and API
  # tokens. The following command can be used to generate a random secret:
  #   openssl rand -base64 32
  # Read from CHIRPSTACK_API_SECRET in .env - see .env.example. This signs
  # every login and API token, so it is a credential and does not belong in
  # version control. There is deliberately no default: an unset variable
  # expands to an empty secret rather than failing, so docker-compose.yml
  # requires it with ${CHIRPSTACK_API_SECRET:?...} before the container starts.
  secret="$CHIRPSTACK_API_SECRET"


[integration]
  enabled=["mqtt"]

  [integration.mqtt]
    server="tcp://$MQTT_BROKER_HOST:1883/"
    json=true
    # QoS 1 so the broker queues uplinks for the EleTect ingest bridge while it is down.
    qos=1
