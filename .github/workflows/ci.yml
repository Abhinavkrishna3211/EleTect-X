name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

# Read-only by default. Nothing here publishes, comments or writes to the
# repo, so the token does not need the write scopes a default grant hands it.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
# Cancel it rather than paying for both and reading whichever lands last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Python: the off-device pipeline (ml/, scripts/) and the MPU cognition
  # layer. These three steps used to be one advisory `ruff ... || true`.
  # ---------------------------------------------------------------------
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff pytest
      # device/mpu resolves its own pyproject.toml; ml/ and scripts/ resolve
      # the root ruff.toml. Both are enforced - no `|| true`. The MPU suite
      # needs no third-party runtime deps by design (device/mpu/pyproject.toml
      # explains why arduino.app_utils must never be imported at module scope),
      # which is what lets it run here on a bare interpreter.
      - run: ruff check device/mpu ml scripts
      - run: pytest -q
        working-directory: device/mpu

  # ---------------------------------------------------------------------
  # Firmware: the host-side Unity suites. No board, no toolchain upload -
  # `native` builds and runs on the runner's own compiler.
  # ---------------------------------------------------------------------
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install platformio
      - name: pio test (all three native environments)
        run: pio test -e native -e native_dfplayer_only -e native_seismic_capture
        working-directory: device/mcu

  # ---------------------------------------------------------------------
  # The MQTT -> Supabase bridge. payload.test.ts holds half of the
  # known-answer wire vectors; device/mcu/tests/test_uplink holds the other
  # half, and the firmware job above runs it. Breaking the wire contract
  # fails one of the two.
  # ---------------------------------------------------------------------
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/ingest/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # ---------------------------------------------------------------------
  # Edge functions. message.test.ts is the one that matters most: it pins
  # audienceFor() to staff_only for any species it does not know, which is
  # the fail-open regression that would page a village by accident.
  # ---------------------------------------------------------------------
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # --no-check matches how these run locally: Supabase's remote type
      # imports are not resolvable without the platform's own type server,
      # and the suites under test are pure functions with no network.
      - run: deno test --no-check --allow-env
        working-directory: web/backend/functions/send-alert
      - run: deno test --no-check --allow-env
        working-directory: web/backend/functions/notify-officer-request

  web-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` is `tsc -b && vite build`, so this is the typecheck gate too.
      - run: npm run build
      - run: npm run test

# The Playwright suites (scripts/qa-*.mjs) are deliberately NOT run here. They
# drive a real browser against a live Supabase project with real staff logins —
# in CI that would mean production credentials in GitHub secrets and every PR
# writing to the production database. They stay a local pre-deploy gate; the
# hermetic Vitest suite over src/lib is what guards every PR.
