; EleTect X - MCU (STM32U585 reflex layer)
;
; PlatformIO is the HOST test and compile harness here. It is not, and cannot
; be, the path to a flashable image: PlatformIO has no board definition for the
; Arduino UNO Q, whose Arduino Core runs on Zephyr and is flashed through App
; Lab / arduino-cli / west + openocd. See docs/decisions/0010.
;
;   pio run   -> compiles the whole src/ tree against hostshim/ (a host-only
;                Arduino API stand-in). Catches signature drift and typos in
;                the hardware files that would otherwise only surface on the
;                board. Produces a compile-check binary, not firmware.
;   pio test  -> Unity known-answer tests over the pure cores (sta_lta,
;                rule_gate), per ENGINEERING_CONVENTIONS.md 4.
;
; The real firmware build runs on the board's own toolchain after
; scripts/sync-to-board.sh copies this tree into the App Lab app.

[platformio]
src_dir = src
test_dir = tests
default_envs = native, native_dfplayer_only, native_seismic_capture

; The standard build: DFPlayer PRO and LoRa-E5 sharing USART1 through the
; 74HC4053 (uart_share.cpp, ADR 0029).
[env:native]
platform = native
test_framework = unity

; Compile src/ into the test binary too, so the tests link against the same
; objects pio run builds - one tree, not a separate test-only copy.
test_build_src = yes

; hostshim/ sits outside src/ so the sync script never copies it to the board.
build_src_filter =
    +<*>
    +<../hostshim/>

build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I src
    -I hostshim

; The same tree built with LORA_ENABLED 0, so the compile-time switch is
; exercised both ways. test_mac is skipped because lora_service() is compiled
; out in this variant.
[env:native_dfplayer_only]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -D LORA_ENABLED=0
test_ignore = test_mac

; The same tree with the MPU-bound seismic dataset stream compiled in
; (ADR 0035). SEISMIC_CAPTURE_ENABLED is 0 in the field build, which means
; geophone.cpp's Bridge.notify("report_seismic_batch") line is preprocessed
; away and never type-checked - this env is what stops that line rotting
; unnoticed between the hardware sessions that could actually run it.
;
; test_filter narrows it to the one suite whose behaviour the flag can
; affect: the other twelve are unchanged by it and running them a third time
; buys nothing. The compile half is the point, and that covers all of src/.
[env:native_seismic_capture]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -D SEISMIC_CAPTURE_ENABLED=1
test_filter = test_seismic_capture
