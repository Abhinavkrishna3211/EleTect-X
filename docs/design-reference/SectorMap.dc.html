<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;min-height:300px;overflow:hidden;border-radius:14px;background:radial-gradient(120% 90% at 30% 20%, #0F1D14 0%, #0A130E 55%, #070D0A 100%);border:1px solid rgba(233,237,230,0.08)">
  <div style="position:absolute;left:8%;top:6%;width:44%;height:52%;background:radial-gradient(closest-side, rgba(47,94,63,0.5), rgba(47,94,63,0));filter:blur(6px);border-radius:50%"></div>
  <div style="position:absolute;left:52%;top:-8%;width:52%;height:60%;background:radial-gradient(closest-side, rgba(38,82,55,0.45), rgba(38,82,55,0));filter:blur(8px);border-radius:50%"></div>
  <div style="position:absolute;left:-6%;top:55%;width:38%;height:50%;background:radial-gradient(closest-side, rgba(43,74,50,0.4), rgba(43,74,50,0));filter:blur(8px);border-radius:50%"></div>
  <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(0deg, rgba(233,237,230,0.05) 0px, rgba(233,237,230,0.05) 1px, transparent 1px, transparent 48px), repeating-linear-gradient(90deg, rgba(233,237,230,0.05) 0px, rgba(233,237,230,0.05) 1px, transparent 1px, transparent 48px)"></div>
  <svg viewBox="0 0 100 62" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">
    <path d="M -2 44 C 18 40, 30 50, 46 46 C 62 42, 74 50, 102 45" fill="none" stroke="rgba(96,140,170,0.5)" stroke-width="1.6"></path>
    <path d="M -2 58 L 30 55 L 62 57 L 102 53" fill="none" stroke="rgba(233,237,230,0.22)" stroke-width="0.7" stroke-dasharray="2 1.2"></path>
    <sc-if value="{{ showCorridor }}" hint-placeholder-val="{{ false }}">
      <polyline points="{{ corridorPoints }}" fill="none" stroke="#E2A13C" stroke-width="0.8" stroke-dasharray="2.4 1.6" style="animation:et-dash 1.6s linear infinite"></polyline>
    </sc-if>
  </svg>
  <div style="position:absolute;left:14%;top:78%;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:9px;height:9px;background:rgba(233,237,230,0.55);transform:rotate(45deg)"></div><span style="font:500 9px 'IBM Plex Mono',monospace;color:rgba(233,237,230,0.5);letter-spacing:0.08em">KOTHAMANGALAM</span></div>
  <div style="position:absolute;left:66%;top:82%;display:flex;flex-direction:column;align-items:center;gap:3px"><div style="width:9px;height:9px;background:rgba(233,237,230,0.55);transform:rotate(45deg)"></div><span style="font:500 9px 'IBM Plex Mono',monospace;color:rgba(233,237,230,0.5);letter-spacing:0.08em">KUTTAMPUZHA</span></div>
  <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="6">
    <div onClick="{{ n.onClick }}" title="{{ n.id }}" style="position:absolute;left:{{ n.left }};top:{{ n.top }};transform:translate(-50%,-50%);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:3">
      <div style="position:relative;width:26px;height:26px;display:grid;place-items:center">
        <sc-if value="{{ n.alert }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid {{ n.color }};animation:et-ping 1.4s ease-out infinite"></div>
        </sc-if>
        <div style="width:11px;height:11px;border-radius:50%;background:{{ n.color }};box-shadow:0 0 10px {{ n.glow }};border:1.5px solid rgba(7,13,10,0.8)"></div>
      </div>
      <span style="font:600 8.5px 'IBM Plex Mono',monospace;color:rgba(233,237,230,0.65);letter-spacing:0.06em">{{ n.id }}</span>
    </div>
  </sc-for>
  <sc-if value="{{ herdVisible }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:{{ herdX }};top:{{ herdY }};transform:translate(-50%,-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:4px;transition:left 1.1s cubic-bezier(.4,0,.2,1), top 1.1s cubic-bezier(.4,0,.2,1)">
      <div style="position:relative;width:34px;height:34px;display:grid;place-items:center">
        <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid #E2A13C;animation:et-ping 1.8s ease-out infinite"></div>
        <div style="width:18px;height:18px;border-radius:50%;background:#E2A13C;display:grid;place-items:center;font:700 9px 'IBM Plex Mono',monospace;color:#161009">{{ herdCount }}</div>
      </div>
      <span style="font:700 8.5px 'IBM Plex Mono',monospace;color:#E2A13C;letter-spacing:0.14em;background:rgba(7,13,10,0.75);padding:2px 6px;border-radius:4px">{{ herdLabel }}</span>
    </div>
  </sc-if>
  <div style="position:absolute;right:12px;top:10px;display:flex;align-items:center;gap:6px;font:600 9.5px 'IBM Plex Mono',monospace;color:rgba(233,237,230,0.55)"><span style="width:7px;height:7px;border-radius:50%;background:#5FA97C;display:inline-block"></span>{{ label }}</div>
  <div style="position:absolute;right:12px;bottom:10px;font:500 9px 'IBM Plex Mono',monospace;color:rgba(233,237,230,0.4)">N ↑ · 1 km ——</div>
  <div style="position:absolute;left:12px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font:500 9px 'IBM Plex Mono',monospace;color:rgba(233,237,230,0.55)">
    <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#5FA97C;margin-right:4px"></span>HEALTHY</span>
    <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#D9B44A;margin-right:4px"></span>ATTENTION</span>
    <span><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#E25B4A;margin-right:4px"></span>ALERT</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:420},&quot;nodes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,left:string,top:string,color:string,glow:string,alert:boolean,onClick:()=&gt;void}[]&quot;},&quot;herdVisible&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;herdX&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;50%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;herdY&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;40%&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;herdCount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;7&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;herdLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;HERD&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showCorridor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;corridorPoints&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;SECTOR 7 — LIVE&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
